name: Lint CI
on: [push, pull_request]

jobs:
  lint:
      runs-on: [ubuntu-latest]
      steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.25

      - name: Run GolangCI-Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: ./...
          timeout: 5m

